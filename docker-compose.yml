# Standalone integration compose: brings up add-ai-backend AND every
# other service it talks to, using pre-built images (build them from
# each sibling repo first, or `docker compose build` from
# add-ai-orchestration and re-tag). This lets you fully exercise the
# API gateway from one `docker compose up` without checking out every
# repo's own compose file individually.
services:
  backend:
    build: .
    image: add-ai-backend:local
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - storage:/data/storage
    depends_on:
      - embeddings-service
      - reranker-service
      - llm-service
      - vectorstore-service
      - sparseindex-service
      - data-service
      - auth-service
      - redis

  embeddings-service:
    image: add-ai-embeddings-service:local
  reranker-service:
    image: add-ai-reranker-service:local
  llm-service:
    image: add-ai-llm-service:local
    env_file: ../add-ai-llm-service/.env
  vectorstore-service:
    image: add-ai-vectorstore-service:local
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on: [qdrant]
  sparseindex-service:
    image: add-ai-sparseindex-service:local
  data-service:
    image: add-ai-data-service:local
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/add_ai
    depends_on:
      postgres:
        condition: service_healthy
  auth-service:
    image: add-ai-auth-service:local
    environment:
      DATA_SERVICE_URL: http://data-service:8007
      JWT_SECRET_KEY: dev-only-secret-change-me
    depends_on: [data-service]

  qdrant:
    image: qdrant/qdrant:v1.11.3
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: add_ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine

volumes:
  storage:
